  - src: squirelib/capabilities/surface.py
    dst: /usr/share/squire-gear/squirelib/capabilities/surface.py
    file_info: {mode: 0644}
  - src: squirelib/protocol.py
    dst: /usr/share/squire-gear/squirelib/protocol.py
    file_info: {mode: 0644}
  - src: squirelib/registry.py
