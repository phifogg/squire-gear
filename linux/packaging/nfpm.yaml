# One config for both Linux packages (nfpm: https://nfpm.goreleaser.com).
# Build with linux/build-packages.sh from anywhere; paths below are relative to the repository root.
#   VERSION comes from __version__ in squire.py.
name: squire-gear
arch: all            # pure Python; nfpm writes "noarch" for rpm
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: Daniel Draes <foggch@gmail.com>
vendor: Squire
homepage: https://github.com/phifogg/squire-gear
license: MIT
description: |
  Battery level of ASUS ROG keyboard and mouse in the top bar
  Squire shows battery level and charging state of the ASUS ROG Falchion RX Low Profile
  keyboard and the ASUS ROG Keris II Origin mouse, through the ROG Omni receiver or the
  USB cable. The battery display only reads; the settings window changes the mouse's lights,
  DPI, sensor and power settings and the keyboard's lighting, per-key colours, sleep time and low-battery
  warning only when you click Apply. Not affiliated with ASUS.

overrides:
  deb:
    depends:
      - python3 (>= 3.10)
      - python3-gi
      - gir1.2-gtk-3.0
      - gir1.2-ayatanaappindicator3-0.1
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - libnotify-bin
    recommends:
      - gnome-shell-extension-appindicator
  rpm:
    depends:
      - python3 >= 3.10
      - python3-gobject
      - gtk3
      - libayatana-appindicator-gtk3
      - gtk4
      - libadwaita
      - libnotify

contents:
  - src: squire.py
    dst: /usr/share/squire-gear/squire.py
    file_info: {mode: 0644}
  # squire.py needs squirelib/ and devices.json next to it (device models)
  - src: devices.json
    dst: /usr/share/squire-gear/devices.json
    file_info: {mode: 0644}
  - src: squirelib/__init__.py
    dst: /usr/share/squire-gear/squirelib/__init__.py
    file_info: {mode: 0644}
  - src: squirelib/capabilities/__init__.py
    dst: /usr/share/squire-gear/squirelib/capabilities/__init__.py
    file_info: {mode: 0644}
  - src: squirelib/capabilities/battery.py
    dst: /usr/share/squire-gear/squirelib/capabilities/battery.py
    file_info: {mode: 0644}
  - src: squirelib/capabilities/dpi.py
